
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薛记炒货提货卡 - 原型</title>
<style>
  *{box-sizing:border-box}
  body{background:#f0f0f0;font-family:"Microsoft YaHei",sans-serif;display:flex;gap:40px;justify-content:center;padding:30px 8px;flex-wrap:wrap}
  .card{width:min(540px,94vw);aspect-ratio:540/320;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);position:relative;overflow:hidden}
  /* ---------- 正面 ---------- */
  .front{background:#c8102e;color:#fff;display:flex}
  .front .left{flex:1.2;padding:6% 2% 4% 5%}
  .front .logo{width:12%;aspect-ratio:64/88;background:#fff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    display:flex;align-items:center;justify-content:center;font-size:min(34px,6vw);font-weight:bold;color:#c8102e;margin-bottom:4%}
  .front h1{font-size:min(30px,5.5vw);margin:3% 0;letter-spacing:2px}
  .front .shop{font-size:min(16px,3vw);letter-spacing:1px;border-top:1px solid rgba(255,255,255,.5);
    padding-top:3%;display:inline-block}
  .front .right{flex:1;background:rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:center;align-items:center}
  .front .seal{width:46%;aspect-ratio:1;border:3px dashed #ffe000;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;transform:rotate(-12deg)}
  .front .seal .amt{font-size:min(50px,9vw);font-weight:bold;color:#ffe000;line-height:1}
  .front .seal .unit{font-size:min(18px,3.5vw);color:#fff;margin-top:4px}
  .front .no{position:absolute;bottom:3%;right:3%;font-size:min(12px,2.5vw);opacity:.85}
  /* ---------- 背面（红底白字） ---------- */
  .back{background:#c8102e;color:#fff;padding:5% 6%}
  .back h2{font-size:min(20px,4.2vw);border-left:5px solid #ffe000;padding-left:8px;margin:0 0 4%;letter-spacing:1px}
  .back .shop{font-size:min(13px,2.8vw);opacity:.95;margin-bottom:3%;color:#fff}
  .back li{font-size:min(13px,2.8vw);line-height:1.9;list-style:none;padding-left:4px}
  .back li b{color:#ffe000}
  .back .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3%}
  .back .stamp{width:20%;aspect-ratio:1;border:2px solid #fff;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:min(15px,3vw);font-weight:bold;transform:rotate(-15deg);opacity:.9}
  .back .no{font-size:min(15px,3.2vw);color:#ffe000;font-weight:bold}
  .back .stamp-box{display:flex;justify-content:center;flex:1}
  .label{display:block;text-align:center;margin-top:10px;font-size:14px;color:#555}
</style>
</head>
<body>
<!-- 正面 -->
<div>
  <div class="card front">
    <div class="left">
      <div class="logo">薛</div>
      <h1>薛记炒货提货卡</h1>
      <div class="shop">薛记炒货枫蓝国际店</div>
    </div>
    <div class="right">
      <div class="seal">
        <div class="amt">100</div>
        <div class="unit">元</div>
      </div>
    </div>
    <div class="no">№001</div>h
  </div>
  <span class="label">正面</span>
</div>
<!-- 背面 -->
<div>
  <div class="card back">
    <h2>薛记炒货枫蓝国际店提货单</h2>
    <div class="shop">沟通方式：13782273586</div>
    <ul>
      <li>1、此卡券只限<b>枫蓝国际店</b>使用（其他店面无效）</li>
      <li>2、面值 <b>100 元</b>：一次性消费，不设找零 </li>
      <li>3、解释权归薛记炒货枫蓝国际店为准</li>
      <li>4、有效期 2026年9月** 至 2026年****</li>
      <li>5、盖有人名章有效</li>
    </ul>
    <div class="row">
      <span style="font-size:min(15px,3.2vw);font-weight:bold">盖章有效</span>
      <div class="stamp-box"><div class="stamp">人名章</div></div>
      <span class="no">№001</span>
    </div>
  </div>
  <span class="label">背面</span>
</div>
</body>
</html>
